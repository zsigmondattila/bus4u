name: Cypress tests
on: push
jobs:
  cypress-run:
    name: Cypress run
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cypress test ADMIN
        uses: cypress-io/github-action@v6
        with:
          project: ./ADMIN_WEB
      - name: Cypress test USER
        uses: cypress-io/github-action@v6
        with:
          project: ./USER_WEB
